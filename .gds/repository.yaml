schema_version: 1

repository:
  id: "PENDING-GDS-ONBOARD"          # assigned by `gds onboard`
  display_name: "nddev-claude-app"
  roles:
    - "module"
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-organization"
  repository_id: 0                    # assigned on GitHub repo creation
  owner: "NDDev-it-com"
  name: "nddev-claude-app"

classification:
  portfolios:
    - "portfolio:organization-projects"
    - "portfolio:public-modules"
  visibility_contract: "public"
  data_classification: "public"

policy:
  profiles:
    - "repository-default"
    - "organization-default"
    - "public-module"
  rollout_ring: "canary-modules"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

verification:
  commands:
    test:
      - "python3 cli-tools/validate_public_contracts.py"
  required:
    - "test"

agent:
  context_profile: "public-module"
  generated_agents: true
  serena:
    enabled: false
    provenance_required: false
