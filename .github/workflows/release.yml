name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  promotion:
    name: Verify exact private promotion
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/release-promotion-gate.yml@f6ea891f09653b8d449098817c8acfdb510731f6 # 0.14.0-dev
    with:
      version: ${{ github.ref_name }}
      runner: amsterdam
  release:
    name: Publish attested immutable release
    needs: promotion
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/release-supply-chain.yml@f6ea891f09653b8d449098817c8acfdb510731f6 # 0.14.0-dev
    with:
      version: ${{ github.ref_name }}
      runner: amsterdam
      package_name: nddev-claude-app
      archive_paths: >-
        AGENTS.md README.md LICENSE VERSION CHANGELOG.md SECURITY.md .gitignore .claude
        .gds .github build cli-tools config plugins references setups
        .claude-plugin
      runtime_paths: >-
        AGENTS.md .claude README.md LICENSE VERSION build cli-tools config
        plugins references setups .claude-plugin
