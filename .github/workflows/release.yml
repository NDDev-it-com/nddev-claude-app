name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Publish attested immutable release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/release-supply-chain.yml@2ccb80e96f5771b6a6b4eae63a4f47e232906dc7 # 0.12.0
    with:
      version: ${{ github.ref_name }}
      package_name: nddev-claude-app
      archive_paths: >-
        AGENTS.md README.md LICENSE VERSION CHANGELOG.md SECURITY.md .gitignore .claude
        .gds .github build cli-tools config plugins references setups
        .claude-plugin
      runtime_paths: >-
        AGENTS.md .claude README.md LICENSE VERSION build cli-tools config
        plugins references setups .claude-plugin
